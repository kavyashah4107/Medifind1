<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - MediFind</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <!-- Navigation Bar -->
    <nav class="navbar">

        <div class="logo">
            💊 MediFind
        </div>

        <div class="nav-links">

            <a href="index.html">Home</a>

            <a href="how-it-works.html">How it works</a>

            <a href="login.html">Login</a>

            <a href="register.html">Register</a>

        </div>

    </nav>


    <!-- Login Section -->
    <section class="login-section">

        <div class="login-card">

            <h1>Welcome Back</h1>

            <p class="login-subtitle">
                Login to your MediFind account
            </p>


            <form
                id="loginForm"
                onsubmit="loginUser(event)"
                action="login.php"
                method="post"
            >

                <!-- Email -->
                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                >


                <!-- Password -->
                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                >


                <!-- Account Type -->
                <label>
                    Login As
                </label>

                <div class="account-type">

                    <label class="account-option">

                        <input
                            type="radio"
                            name="accountType"
                            value="customer"
                            checked
                        >

                        👤 Customer

                    </label>


                    <label class="account-option">

                        <input
                            type="radio"
                            name="accountType"
                            value="pharmacy"
                        >

                        🏪 Pharmacy

                    </label>

                </div>


                <!-- Login Message -->
                <p id="loginMessage"></p>


                <!-- Login Button -->
                <button type="submit">
                    Login
                </button>


                <!-- Register Link -->
                <p class="register-text">

                    Don't have an account?

                    <a href="register.html">
                        Create Account
                    </a>

                </p>

            </form>

        </div>

    </section>


    <!-- Footer -->
    <footer>

        <p>
            © 2026 MediFind. All rights reserved.
        </p>

    </footer>


    <script src="js/script.js"></script>

</body>

</html>
